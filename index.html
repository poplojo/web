<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>gemvi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 15px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ccc;
      padding-bottom: 10px;
    }
    .listing {
      border: 1px solid #ccc;
      padding: 10px;
      margin-top: 15px;
    }
    .listing h3 {
      margin: 0 0 6px 0;
    }
    .listing p {
      margin: 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>gemvi</h1>
    <a href="upload.html">+ Add listing</a>
  </header>

  <main id="listings-list">
    <!-- Listings load here -->
  </main>

  <script>
    const listContainer = document.getElementById('listings-list');
    const items = JSON.parse(localStorage.getItem('gemvi_items') || '[]');

    if (items.length === 0) {
      listContainer.innerHTML = '<p>No listings yet.</p>';
    } else {
      items.forEach(item => {
        const box = document.createElement('div');
        box.className = 'listing';
        box.innerHTML = `
          <h3>${item.title}</h3>
          <p>${item.description}</p>
        `;
        listContainer.appendChild(box);
      });
    }
  </script>

</body>
</html>
